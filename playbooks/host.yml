# Thin AAP-ready entry point for patchmon.core.host
# Prefer hosts: localhost when only creating API host entries.
- name: Manage PatchMon host entry
  hosts: all
  gather_facts: false

  tasks:
    - name: Run PatchMon host role
      ansible.builtin.import_role:
        name: patchmon.core.host
