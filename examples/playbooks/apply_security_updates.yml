# Security-only updates for Automated and No Reboot hosts that PatchMon
# reports as security_required. Gates on inventory hostvars
# patchmon_update_state and patchmon_security_updates_count. Those stay
# inventory data, so the play can decide before fact gathering. Do not put
# patchmon_security_required in hosts: — that group exists only while a host
# matches. A host also in patchmon_manual is skipped.
#
# dnf and dnf5 use security: true. apt has no matching flag, so apt hosts are
# unchanged unless patchmon_try_listed_security is true. That option upgrades
# only names host_packages marks is_security_update.
#
# After the update tasks, run patchmon.core.agent with agent_state report.
# Does not reboot — reboot_needed.yml does that, and maintain.yml runs both.
#
# Requires:
#   - Stats inventory (examples/patchmon_inventory_stats.yml)
#   - Env for the apt opt-in and for nothing else on dnf: PATCHMON_API_URL,
#     PATCHMON_API_KEY, PATCHMON_API_SECRET
#
# Example:
#   ansible-playbook -i inventories/patchmon.yml \
#     examples/playbooks/apply_security_updates.yml
#   ansible-playbook -i inventories/patchmon.yml \
#     examples/playbooks/apply_security_updates.yml \
#     -e patchmon_try_listed_security=true

- name: Apply security updates for PatchMon security_required hosts
  hosts: patchmon_automated:patchmon_no_reboot
  gather_facts: true
  become: true
  vars:
    patchmon_try_listed_security: false
    patchmon_api_url: "{{ lookup('env', 'PATCHMON_API_URL') }}"
    patchmon_api_key: "{{ lookup('env', 'PATCHMON_API_KEY') }}"
    patchmon_api_secret: "{{ lookup('env', 'PATCHMON_API_SECRET') }}"
    patchmon_verify_ssl: "{{ lookup('env', 'PATCHMON_VERIFY_SSL') | default(true, true) }}"

  tasks:
    - name: Record whether PatchMon reports security updates
      ansible.builtin.set_fact:
        patchmon_security_pending: >-
          {{
            (patchmon_update_state | default('')) == 'security_required'
            or (patchmon_security_updates_count | default(0) | int > 0)
          }}

    - name: Apply dnf security updates  # noqa: package-latest
      ansible.builtin.dnf:
        name: "*"
        state: latest
        security: true
        update_cache: true
      when:
        - patchmon_security_pending | bool
        - "'patchmon_manual' not in group_names"
        - ansible_pkg_mgr == 'dnf'

    - name: Apply dnf5 security updates  # noqa: package-latest
      ansible.builtin.dnf5:
        name: "*"
        state: latest
        security: true
        update_cache: true
      when:
        - patchmon_security_pending | bool
        - "'patchmon_manual' not in group_names"
        - ansible_pkg_mgr == 'dnf5'

    - name: Require PatchMon API access for listed security packages
      ansible.builtin.assert:
        that:
          - patchmon_id | default('') | length > 0
          - patchmon_api_url | length > 0
          - patchmon_api_key | length > 0
          - patchmon_api_secret | length > 0
        fail_msg: >-
          patchmon_try_listed_security on {{ inventory_hostname }} needs
          inventory hostvar patchmon_id and PATCHMON_API_URL, PATCHMON_API_KEY,
          and PATCHMON_API_SECRET (Integration host:get).
      when:
        - patchmon_try_listed_security | bool
        - patchmon_security_pending | bool
        - "'patchmon_manual' not in group_names"
        - ansible_pkg_mgr == 'apt'

    - name: Fetch PatchMon packages with pending updates
      patchmon.core.host_packages:
        api_url: "{{ patchmon_api_url }}"
        api_key: "{{ patchmon_api_key }}"
        api_secret: "{{ patchmon_api_secret }}"
        verify_ssl: "{{ patchmon_verify_ssl | bool }}"
        host_id: "{{ patchmon_id }}"
        updates_only: true
      delegate_to: localhost
      become: false
      register: patchmon_security_pkgs
      when:
        - patchmon_try_listed_security | bool
        - patchmon_security_pending | bool
        - "'patchmon_manual' not in group_names"
        - ansible_pkg_mgr == 'apt'

    - name: Record PatchMon security package names
      ansible.builtin.set_fact:
        patchmon_security_package_names: >-
          {{
            patchmon_security_pkgs.packages
            | selectattr('is_security_update')
            | map(attribute='name')
            | list
          }}
      when:
        - patchmon_try_listed_security | bool
        - patchmon_security_pending | bool
        - "'patchmon_manual' not in group_names"
        - ansible_pkg_mgr == 'apt'

    - name: Upgrade apt packages PatchMon marks as security updates  # noqa: package-latest
      ansible.builtin.apt:
        name: "{{ patchmon_security_package_names }}"
        state: latest
        only_upgrade: true
        update_cache: true
      when:
        - patchmon_try_listed_security | bool
        - patchmon_security_pending | bool
        - "'patchmon_manual' not in group_names"
        - ansible_pkg_mgr == 'apt'
        - patchmon_security_package_names | default([]) | length > 0

    - name: Report package state to PatchMon after security updates
      ansible.builtin.include_role:
        name: patchmon.core.agent
      vars:
        agent_state: report
      when:
        - patchmon_security_pending | bool
        - "'patchmon_manual' not in group_names"
        - >-
          ansible_pkg_mgr in ['dnf', 'dnf5']
          or (
            patchmon_try_listed_security | bool
            and ansible_pkg_mgr == 'apt'
          )
