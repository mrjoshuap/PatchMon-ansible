---
# =============================================================================
# PatchMon dynamic inventory — minimal / backward-compatible example
# =============================================================================
#
# Full walkthrough (prereqs, copy/configure, troubleshooting):
#   docs/automator-guide.md
#
# WHAT THIS DOES
#   Queries PatchMon's Integration API and builds a basic Ansible inventory:
#   hostname → inventory host, ip → ansible_host, host_groups → Ansible groups.
#   No stats hostvars or derived patchmon_* groups (include_stats defaults false).
#
# WHEN TO USE THIS FILE
#   Drop-in style matching the original v1.0 plugin behavior.
#   For reboot / security / OS metadata and auto groups, see
#   examples/patchmon_inventory_stats.yml instead.
#
# QUICK START
#   1. Copy this file (e.g. inventories/patchmon.yml).
#   2. Export PATCHMON_SERVER_URL (preferred) and omit api_url.
#      The plugin derives https://<server>/api/v1/api/hosts.
#      Setting api_url or PATCHMON_API_URL directly is discouraged.
#   3. Export credentials (recommended) or uncomment api_key / api_secret below:
#        export PATCHMON_SERVER_URL='https://patchmon.example.com'
#        export PATCHMON_API_KEY='<token key>'
#        export PATCHMON_API_SECRET='<token secret>'
#        # Optional TLS. true is the default. false is for a lab only.
#        # export PATCHMON_VERIFY_SSL=true
#   4. Enable the plugin in ansible.cfg if needed:
#        [inventory]
#        enable_plugins = patchmon.core.inventory
#   5. List inventory:
#        ansible-inventory -i patchmon_inventory.yml --list
#   6. Target a PatchMon host group (patchmon_<slug>):
#        ansible all -i patchmon_inventory.yml -m ping --limit patchmon_production
#
# CREDENTIALS (pick one)
#   - Environment: PATCHMON_SERVER_URL (preferred), PATCHMON_API_KEY,
#     PATCHMON_API_SECRET
#     PATCHMON_API_URL overrides the derived hosts URL and is discouraged.
#     (optional) PATCHMON_VERIFY_SSL=true|false
#   - ansible.cfg [patchmon] api_url / api_key / api_secret / verify_ssl
#     Setting api_url there overrides PATCHMON_SERVER_URL and is discouraged.
#   - Literal api_key / api_secret in this file (avoid committing secrets).
#     This file is not templated. lookup() and other Jinja are not expanded
#     for connection options. compose, groups, and keyed_groups are the
#     exception: the plugin evaluates those expressions.
#
# INVENTORY SHAPE (default / no stats)
#   Hostvars: ansible_host (from ip); patchmon_id / patchmon_friendly_name when
#             present in the API response
#   Groups:   patchmon_<slug> for each host group (No Reboot → patchmon_no_reboot)
#
# =============================================================================

# Required: identify this file as the PatchMon inventory plugin
plugin: patchmon.core.inventory

# ---------------------------------------------------------------------------
# Connection (required unless provided via env / ansible.cfg)
# ---------------------------------------------------------------------------

# Prefer PATCHMON_SERVER_URL and omit api_url. The plugin derives
# /api/v1/api/hosts. Uncomment api_url only to override that URL.
# Setting api_url or PATCHMON_API_URL directly is discouraged.
# api_url: https://patchmon.example.com/api/v1/api/hosts
# api_key: your_token_key
# api_secret: your_token_secret

# Do not put lookup() or other Jinja in api_url, api_key, or api_secret.
# Ansible does not template those inventory options. Export the environment
# variables above, or set literal values.

# TLS verification (default: true). Set false only for lab / self-signed certs.
verify_ssl: true
# verify_ssl: false

# HTTP timeout in seconds (default: 30)
# timeout: 30

# ---------------------------------------------------------------------------
# Optional filters & identity (still compatible with a lean inventory)
# ---------------------------------------------------------------------------

# Limit the API query to one or more PatchMon host groups (OR logic).
# Group id or the exact PatchMon name. No Reboot and No_Reboot are different.
# A patchmon_<slug> token is not translated. Omit to return all hosts.
# hostgroup: Production
# hostgroup: "No Reboot"
# hostgroup:
#   - Production
#   - Development

# Inventory hostname source (default: hostname)
# inventory_hostname_prefer: hostname
# inventory_hostname_prefer: friendly_name

# ---------------------------------------------------------------------------
# Stats — leave off for v1.0-style lean inventory (defaults shown)
# Uncomment include_stats to opt into patchmon_* hostvars and auto groups.
# Full Constructable examples: patchmon_inventory_stats.yml
# ---------------------------------------------------------------------------

# include_stats: false
# include_stats: true
# stats_var_scope: all
# stats_var_scope: targeting
# auto_groups: true

# ---------------------------------------------------------------------------
# Constructable (optional; same options as other Ansible inventory plugins)
# ---------------------------------------------------------------------------

# compose:
#   ansible_user: '"ansible"'

# keyed_groups: []

# groups: {}

# strict: false
# use_extra_vars: false

# ---------------------------------------------------------------------------
# Inventory cache (optional; requires a configured cache plugin)
# ---------------------------------------------------------------------------

# cache: false
# cache_plugin: memory
# cache_timeout: 3600
