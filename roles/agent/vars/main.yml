# Internal static values for patchmon.core.agent
__agent_valid_states:
  - present
  - started
  - stopped
  - absent
  - report

# Substrings in a failed enrollment script that mean the platform is unsupported.
# Matched case-insensitively. The script body is not copied into the fail message.
__agent_unsupported_markers:
  - unsupported
  - not supported
  - exec format error
  - unknown architecture
  - package manager
