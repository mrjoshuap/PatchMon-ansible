# Reboot patchmon_automated hosts one at a time when the inventory hostvar
# patchmon_needs_reboot is true. Do not target the patchmon_needs_reboot
# group: it exists only while a host matches, and this play does not gather
# facts (a flat patchmon_* fact would override the hostvar).
# patchmon_manual and patchmon_no_reboot are skipped by the role.
# After a reboot that changes the host, patchmon.core.reboot_needed runs
# patchmon.core.agent report.
#
# Requires a stats inventory (examples/patchmon_inventory_stats.yml).
#
# Example:
#   ansible-playbook -i inventories/patchmon.yml \
#     examples/playbooks/reboot_needed.yml

- name: Reboot automated hosts that PatchMon reports need a reboot
  hosts: patchmon_automated
  gather_facts: false
  become: true
  serial: 1

  tasks:
    - name: Reboot hosts that need a reboot
      ansible.builtin.import_role:
        name: patchmon.core.reboot_needed
