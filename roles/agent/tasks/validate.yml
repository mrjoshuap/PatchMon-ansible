---
# SPDX-License-Identifier: AGPL-3.0-or-later
- name: Validate agent_state
  ansible.builtin.assert:
    that:
      - agent_state is defined
      - agent_state in __agent_valid_states
    fail_msg: >-
      agent_state must be one of {{ __agent_valid_states | join(', ') }}.
      Got '{{ agent_state | default('undefined') }}'.

- name: Fail when the host is Windows
  ansible.builtin.fail:
    msg: >-
      {{ inventory_hostname }} is {{ ansible_os_family }}.
      patchmon.core.agent stopped before running the enrollment script.

      Create a PatchMon feedback request: https://feedback.patchmon.net/

      Subject: Add a Windows installer path to patchmon.core.agent

      Description:
      patchmon.core.agent runs the POSIX enrollment script
      (direct-host or proxmox-lxc).
      {{ inventory_hostname }} is {{ ansible_os_family }}
      ({{ ansible_distribution | default('unknown') }}
      {{ ansible_distribution_version | default('') }}).
      PatchMon's Windows installer is a PowerShell script.
      Please add a windows script type to the collection.
  when:
    - ansible_os_family is defined
    - ansible_os_family == 'Windows'

- name: Validate enrollment credentials for install states
  ansible.builtin.assert:
    that:
      - agent_server_url is defined
      - agent_server_url | length > 0
      - agent_enrollment_key is defined
      - agent_enrollment_key | length > 0
      - agent_enrollment_secret is defined
      - agent_enrollment_secret | length > 0
    fail_msg: >-
      agent_server_url, agent_enrollment_key, and agent_enrollment_secret are
      required when agent_state is present (auto-enrollment script install).
      Create an Auto-Enrollment token under Settings → Integrations in PatchMon.
      See docs/permissions.md.
  when: agent_state == 'present'

- name: Warn when TLS verification is disabled
  ansible.builtin.debug:
    msg: >-
      WARNING: agent_verify_ssl is false. Use only in lab environments.
    verbosity: 0
  when: not (agent_verify_ssl | bool)
