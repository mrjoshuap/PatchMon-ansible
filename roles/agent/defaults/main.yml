---
# SPDX-License-Identifier: AGPL-3.0-or-later
# Variables for patchmon.core.agent — all user-facing vars use agent_ prefix.

# Desired agent lifecycle: present (install+start), started, stopped, absent, report
agent_state: present

# Auto-enrollment URL. Prefer PATCHMON_SERVER_URL; the lookup derives
# {server}/api/v1/auto-enrollment. PATCHMON_ENROLLMENT_URL overrides that
# and is discouraged. PATCHMON_API_URL is a last resort.
agent_server_url: "{{ lookup('patchmon.core.endpoint', 'enrollment') }}"

# Auto-enrollment credentials (for script-based install)
agent_enrollment_key: "{{ lookup('env', 'PATCHMON_ENROLLMENT_KEY') | default('', true) }}"
agent_enrollment_secret: "{{ lookup('env', 'PATCHMON_ENROLLMENT_SECRET') | default('', true) }}"

agent_script_type: direct-host
agent_force_install: false
agent_force_new_host: false

agent_verify_ssl: "{{ lookup('env', 'PATCHMON_VERIFY_SSL') | default(true, true) }}"
agent_timeout: 30

# Where to stage the enrollment script on the managed host
agent_script_path: /tmp/patchmon-enroll.sh

# Controller-side path for host_token dest= (avoids no_log script-body censoring)
agent_script_controller_path: /tmp/patchmon-enroll-{{ inventory_hostname }}.sh

# On install failure, keep a copy for debugging (contains enrollment secrets)
agent_keep_failed_script: false
agent_failed_script_path: /var/tmp/patchmon-enroll-failed-{{ inventory_hostname }}.sh

# Service / binary names (override per platform in vars/ if needed)
agent_service_name: "{{ 'PatchMonAgent' if ansible_facts['os_family'] | default('') == 'Windows' else 'patchmon-agent' }}"
agent_binary_path: >-
  {{ 'C:\Program Files\PatchMon\patchmon-agent.exe'
     if ansible_facts['os_family'] | default('') == 'Windows' else '/usr/local/bin/patchmon-agent' }}
agent_config_dir: >-
  {{ 'C:\ProgramData\PatchMon'
     if ansible_facts['os_family'] | default('') == 'Windows' else '/etc/patchmon' }}

# When true, run agent report after ensure-started
agent_report: false
