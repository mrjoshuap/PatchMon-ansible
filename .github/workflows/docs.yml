---
# Build the patchmon.core docsite and publish it to GitHub Pages on this fork.
# Pull requests build only. Push to main and workflow_dispatch deploy.
# Collection doc lint is in checks.yml and gates releases.
name: Documentation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core>=2.15" "antsibull-docs"

      - name: Link checkout as patchmon.core
        run: |
          link="$GITHUB_WORKSPACE/.collections/ansible_collections/patchmon/core"
          mkdir -p "$(dirname "$link")"
          if [[ -e "$link" && ! -L "$link" ]]; then
            rm -rf "$link"
          fi
          ln -sfn "$GITHUB_WORKSPACE" "$link"
          echo "ANSIBLE_COLLECTIONS_PATHS=$GITHUB_WORKSPACE/.collections" >> "$GITHUB_ENV"

      - name: Build docsite
        run: bash docs/build-docsite.sh

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: built-docs/build/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
