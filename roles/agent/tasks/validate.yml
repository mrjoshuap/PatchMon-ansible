---
# SPDX-License-Identifier: AGPL-3.0-or-later
- name: Validate agent_state
  ansible.builtin.assert:
    that:
      - agent_state is defined
      - agent_state in __agent_valid_states
    fail_msg: >-
      agent_state must be one of {{ __agent_valid_states | join(', ') }}.
      Got '{{ agent_state | default('undefined') }}'.

- name: Load Windows platform defaults
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/Windows.yml"
  when:
    - ansible_facts['os_family'] | default('') == 'Windows'
    - role_path is defined

- name: Validate server URL for install
  ansible.builtin.assert:
    that:
      - agent_server_url is defined
      - agent_server_url | length > 0
    fail_msg: agent_server_url is required when agent_state is present.
  when: agent_state == 'present'

- name: Validate Windows host credential pair
  ansible.builtin.assert:
    that:
      - (agent_api_id | length > 0) == (agent_api_key | length > 0)
    fail_msg: Supply both agent_api_id and agent_api_key, or neither.
  when:
    - agent_state == 'present'
    - ansible_facts['os_family'] | default('') == 'Windows'

- name: Validate enrollment credentials for install states
  ansible.builtin.assert:
    that:
      - agent_enrollment_key is defined
      - agent_enrollment_key | length > 0
      - agent_enrollment_secret is defined
      - agent_enrollment_secret | length > 0
    fail_msg: >-
      agent_enrollment_key and agent_enrollment_secret are required when agent_state is present
      for Auto-Enrollment.
      Windows installation can instead use agent_api_id and agent_api_key for an existing host.
      Create an Auto-Enrollment token under Settings → Integrations in PatchMon.
  when:
    - agent_state == 'present'
    - >-
      ansible_facts['os_family'] | default('') != 'Windows'
      or not (agent_api_id | length > 0 and agent_api_key | length > 0)

- name: Validate server URL for Windows removal
  ansible.builtin.assert:
    that:
      - agent_server_url is defined
      - agent_server_url | length > 0
    fail_msg: >-
      agent_server_url is required when removing the Windows agent so the role
      can download GET /api/v1/hosts/remove?os=windows. Prefer PATCHMON_SERVER_URL.
  when:
    - agent_state == 'absent'
    - ansible_facts['os_family'] | default('') == 'Windows'

- name: Warn when TLS verification is disabled
  ansible.builtin.debug:
    msg: >-
      WARNING: agent_verify_ssl is false. Use only in lab environments.
    verbosity: 0
  when: not (agent_verify_ssl | bool)
