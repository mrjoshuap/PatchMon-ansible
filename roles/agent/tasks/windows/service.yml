- name: Manage the installed Windows PatchMon agent service
  ansible.windows.win_service:
    name: "{{ agent_service_name }}"
    state: "{{ 'started' if agent_state in ['present', 'started'] else 'stopped' }}"
    start_mode: "{{ 'auto' if agent_state in ['present', 'started'] else omit }}"
  become: false
