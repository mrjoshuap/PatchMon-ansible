---
# List packages with available updates (highlight security) via PatchMon API.
#
# Requires:
#   - Inventory that sets patchmon_id (stats inventory recommended)
#   - Env: PATCHMON_SERVER_URL (preferred), PATCHMON_API_KEY, PATCHMON_API_SECRET
#     PATCHMON_API_URL overrides the derived hosts URL and is discouraged.
#
# Configuration (defaults). Credentials come from the env via vars: below.
# Prefer inventory host_vars / group_vars for fleet ignore lists.
#
#   patchmon_verify_ssl: true            # or PATCHMON_VERIFY_SSL
#   patchmon_ignore_packages: []         # names listed under [IGNORED]
#   updates_only: true                   # host_packages filter (task below)
#
# Example — all hosts with security updates pending:
#   ansible-playbook -i inventories/patchmon.yml \
#     examples/playbooks/pending_updates.yml \
#     --limit patchmon_security_required
#
# Example — one host:
#   ansible-playbook -i inventories/patchmon.yml \
#     examples/playbooks/pending_updates.yml \
#     --limit web01.example.com
#
# Example — hide packages you already skip during upgrades:
#   ansible-playbook -i inventories/patchmon.yml \
#     examples/playbooks/pending_updates.yml \
#     -e '{"patchmon_ignore_packages":["linux-image-generic"]}'

- name: List pending package updates from PatchMon
  hosts: all
  gather_facts: false
  vars:
    patchmon_api_url: "{{ lookup('patchmon.core.endpoint', 'api') }}"
    patchmon_api_key: "{{ lookup('env', 'PATCHMON_API_KEY') }}"
    patchmon_api_secret: "{{ lookup('env', 'PATCHMON_API_SECRET') }}"
    patchmon_verify_ssl: "{{ lookup('env', 'PATCHMON_VERIFY_SSL') | default(true, true) }}"
    # patchmon_verify_ssl: false
    # patchmon_ignore_packages: []

  tasks:
    - name: Require PatchMon host UUID from inventory
      ansible.builtin.assert:
        that:
          - patchmon_id is defined
          - patchmon_id | length > 0
        fail_msg: >-
          Host {{ inventory_hostname }} has no patchmon_id. Use
          examples/patchmon_inventory_stats.yml or set patchmon_id.

    - name: Fetch packages that need updates
      patchmon.core.host_packages:
        api_url: "{{ patchmon_api_url }}"
        api_key: "{{ patchmon_api_key }}"
        api_secret: "{{ patchmon_api_secret }}"
        verify_ssl: "{{ patchmon_verify_ssl | bool }}"
        host_id: "{{ patchmon_id }}"
        updates_only: true
      delegate_to: localhost
      register: pm_pkgs

    - name: Summarize update counts
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: {{ pm_pkgs.total }} package(s) with updates
          ({{ pm_pkgs.security_updates_count }} security)

    - name: List packages ignored by inventory knobs
      ansible.builtin.debug:
        msg: >-
          [IGNORED] {{ item.name }}:
          {{ item.current_version }} -> {{ item.available_version }}
      loop: >-
        {{ pm_pkgs.packages
           | selectattr('name', 'in', (patchmon_ignore_packages | default([])))
           | list }}
      loop_control:
        label: "{{ item.name }}"
      when: (patchmon_ignore_packages | default([])) | length > 0

    - name: List security updates
      ansible.builtin.debug:
        msg: >-
          [SECURITY] {{ item.name }}:
          {{ item.current_version }} -> {{ item.available_version }}
      loop: >-
        {{ pm_pkgs.packages
           | selectattr('is_security_update')
           | rejectattr('name', 'in', (patchmon_ignore_packages | default([])))
           | list }}
      loop_control:
        label: "{{ item.name }}"
      when: pm_pkgs.security_updates_count | int > 0

    - name: List non-security updates
      ansible.builtin.debug:
        msg: >-
          {{ item.name }}:
          {{ item.current_version }} -> {{ item.available_version }}
      loop: >-
        {{ pm_pkgs.packages
           | rejectattr('is_security_update')
           | rejectattr('name', 'in', (patchmon_ignore_packages | default([])))
           | list }}
      loop_control:
        label: "{{ item.name }}"
      when: (pm_pkgs.total | int) > (pm_pkgs.security_updates_count | int)
