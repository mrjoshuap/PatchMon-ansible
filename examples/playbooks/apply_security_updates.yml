# Security-only updates for Automated and No Reboot hosts that PatchMon
# reports as security_required. Gates on inventory hostvars
# patchmon_update_state and patchmon_security_updates_count. Those stay
# inventory data, so the play can decide before fact gathering. Do not put
# patchmon_security_required in hosts: — that group exists only while a host
# matches. A host also in patchmon_manual is skipped by the role.
#
# patchmon.core.apply_security_updates applies dnf and dnf5 with security: true.
# apt is unchanged unless patchmon_try_listed_security or
# apply_security_updates_try_listed is true. That option upgrades only names
# host_packages marks is_security_update. Any other package manager fails
# the eligible host with a PatchMon feedback draft.
#
# The role reports with patchmon.core.agent (agent_state: report).
# Does not reboot — reboot_needed.yml does that. maintain.yml runs both
# unless -e apply_all_updates=true selects apply_all_updates.yml instead.
#
# Requires:
#   - Stats inventory (examples/patchmon_inventory_stats.yml)
#   - Env for the apt opt-in and for nothing else on dnf: PATCHMON_SERVER_URL
#     (preferred), PATCHMON_API_KEY, PATCHMON_API_SECRET.
#     PATCHMON_API_URL overrides the derived hosts URL and is discouraged.
#
# Example:
#   ansible-playbook -i inventories/patchmon.yml \
#     examples/playbooks/apply_security_updates.yml
#   ansible-playbook -i inventories/patchmon.yml \
#     examples/playbooks/apply_security_updates.yml \
#     -e patchmon_try_listed_security=true

- name: Apply security updates for PatchMon security_required hosts
  hosts: patchmon_automated:patchmon_no_reboot
  gather_facts: true
  become: true
  vars:
    patchmon_try_listed_security: false

  tasks:
    - name: Apply security updates
      ansible.builtin.import_role:
        name: patchmon.core.apply_security_updates
