---
# SPDX-License-Identifier: AGPL-3.0-or-later
- name: Validate security update inputs
  ansible.builtin.include_tasks: validate.yml

- name: Record whether PatchMon reports security updates
  ansible.builtin.set_fact:
    apply_security_updates_pending: >-
      {{
        (patchmon_update_state | default('')) == 'security_required'
        or (patchmon_security_updates_count | default(0) | int > 0)
      }}
    apply_security_updates_supported_pkg_mgrs: "{{ ['apt', 'dnf', 'dnf5', 'pacman'] }}"
    apply_security_updates_severity_normalized: "{{ apply_security_updates_severity | map('lower') | list }}"

- name: Record whether this host is eligible for security updates
  ansible.builtin.set_fact:
    apply_security_updates_eligible: >-
      {{
        apply_security_updates_pending | bool
        and 'patchmon_manual' not in group_names
      }}

- name: Wait for package-manager locks before security updates
  ansible.builtin.include_tasks: wait_locks.yml
  when:
    - apply_security_updates_eligible | bool
    - apply_security_updates_force | bool
    - apply_security_updates_lock_timeout | int > 0
    - ansible_facts['pkg_mgr'] in apply_security_updates_supported_pkg_mgrs

- name: Fetch listed packages for apt or pacman opt-in path
  ansible.builtin.include_tasks: listed_packages.yml
  when:
    - apply_security_updates_eligible | bool
    - apply_security_updates_try_listed | bool
    - ansible_facts['pkg_mgr'] in ['apt', 'pacman']

- name: Apply security updates for the host package manager
  ansible.builtin.include_tasks: "pkg_mgr/{{ ansible_facts['pkg_mgr'] }}.yml"
  when:
    - apply_security_updates_eligible | bool
    - ansible_facts['pkg_mgr'] in apply_security_updates_supported_pkg_mgrs

- name: Fail on unsupported package manager
  ansible.builtin.include_tasks: unsupported.yml
  when:
    - apply_security_updates_eligible | bool
    - ansible_facts['pkg_mgr'] not in apply_security_updates_supported_pkg_mgrs

- name: Report package state to PatchMon after security updates
  ansible.builtin.include_tasks: report.yml
  when:
    - apply_security_updates_eligible | bool
    - >-
      ansible_facts['pkg_mgr'] in ['dnf', 'dnf5']
      or (
        apply_security_updates_try_listed | bool
        and ansible_facts['pkg_mgr'] in ['apt', 'pacman']
      )
