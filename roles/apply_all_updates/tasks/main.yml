---
# SPDX-License-Identifier: AGPL-3.0-or-later
- name: Validate all-updates inputs
  ansible.builtin.include_tasks: validate.yml

- name: Record whether this host is eligible for all pending upgrades
  ansible.builtin.set_fact:
    apply_all_updates_eligible: "{{ 'patchmon_manual' not in group_names }}"
    apply_all_updates_supported_pkg_mgrs: "{{ ['apt', 'dnf', 'dnf5', 'pacman'] }}"

- name: Wait for package-manager locks before upgrades
  ansible.builtin.include_tasks: wait_locks.yml
  when:
    - apply_all_updates_eligible | bool
    - apply_all_updates_force | bool
    - apply_all_updates_lock_timeout | int > 0
    - ansible_facts['pkg_mgr'] in apply_all_updates_supported_pkg_mgrs

- name: Apply upgrades for the host package manager
  ansible.builtin.include_tasks: "pkg_mgr/{{ ansible_facts['pkg_mgr'] }}.yml"
  when:
    - apply_all_updates_eligible | bool
    - ansible_facts['pkg_mgr'] in apply_all_updates_supported_pkg_mgrs

- name: Fail on unsupported package manager
  ansible.builtin.include_tasks: unsupported.yml
  when:
    - apply_all_updates_eligible | bool
    - ansible_facts['pkg_mgr'] not in apply_all_updates_supported_pkg_mgrs

- name: Report package state to PatchMon after upgrades
  ansible.builtin.include_tasks: report.yml
  when:
    - apply_all_updates_eligible | bool
    - ansible_facts['pkg_mgr'] in apply_all_updates_supported_pkg_mgrs
