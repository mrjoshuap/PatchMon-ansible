---
# Pull-request and main-branch validation for patchmon.core
name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core>=2.15" "requests>=2.25.1" pytest ansible-lint

      - name: Link checkout as patchmon.core
        run: |
          link="$GITHUB_WORKSPACE/.collections/ansible_collections/patchmon/core"
          mkdir -p "$(dirname "$link")"
          if [[ -e "$link" && ! -L "$link" ]]; then
            rm -rf "$link"
          fi
          ln -sfn "$GITHUB_WORKSPACE" "$link"

      - name: Run unit tests
        run: pytest -q

      - name: Lint example playbooks and collection playbooks
        run: ansible-lint examples/playbooks playbooks
