- name: Fail on unsupported package manager for cleanup
  ansible.builtin.fail:
    msg: >-
      Unsupported package manager {{ ansible_facts['pkg_mgr'] }} on
      {{ inventory_hostname }} for patchmon.core.package_cleanup.
      Supported managers are apt, dnf, dnf5, and pacman.
