---
# Build and attach the Ansible collection tarball to a GitHub Release.
# Trigger: push a tag matching vX.Y.Z or pre-release (e.g. v2.0.0-alpha).
# Tag without leading v must equal galaxy.yml version.
name: Release collection

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v2.0.0 or v2.0.0-alpha). Required for manual runs."
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # For workflow_dispatch against an existing tag, fetch tags
          fetch-depth: 0

      - name: Resolve version from tag
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG}"
            git checkout "refs/tags/${TAG}"
          else
            TAG="${REF_NAME}"
          fi
          case "${TAG}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "Tag must look like vX.Y.Z or vX.Y.Z-alpha (got: ${TAG})"
              exit 1
              ;;
          esac
          VERSION="${TAG#v}"
          TARBALL="patchmon-core-${VERSION}.tar.gz"
          PRERELEASE=false
          case "${VERSION}" in
            *-alpha*|*-beta*|*-rc*|*-a*|*-b*)
              PRERELEASE=true
              ;;
          esac
          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "tarball=${TARBALL}"
            echo "prerelease=${PRERELEASE}"
          } >> "${GITHUB_OUTPUT}"
          echo "Releasing ${TAG} (version ${VERSION}, prerelease=${PRERELEASE})"

      - name: Verify galaxy.yml version matches tag
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          GALAXY_VERSION="$(awk '/^version:/{gsub(/["'\'']/, "", $2); print $2; exit}' galaxy.yml)"
          if [ "${GALAXY_VERSION}" != "${VERSION}" ]; then
            echo "ERROR: galaxy.yml version (${GALAXY_VERSION}) does not match tag v${VERSION}"
            exit 1
          fi
          echo "galaxy.yml version ${GALAXY_VERSION} matches tag"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core>=2.15" "requests>=2.25.1" pytest

      - name: Run unit tests
        run: pytest -q

      - name: Build collection tarball
        run: ansible-galaxy collection build --force

      - name: Confirm tarball exists
        env:
          TARBALL: ${{ steps.meta.outputs.tarball }}
        run: |
          set -euo pipefail
          test -f "${TARBALL}"
          ls -la "${TARBALL}"
          sha256sum "${TARBALL}"

      - name: Write release notes
        id: notes
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TARBALL: ${{ steps.meta.outputs.tarball }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          python3 - "${NOTES_FILE}" <<'PY'
          import pathlib
          import re
          import sys
          import os

          notes_path = pathlib.Path(sys.argv[1])
          version = os.environ["VERSION"]
          tarball = os.environ["TARBALL"]
          repo = os.environ["REPO"]

          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## |\Z)"
          match = re.search(pattern, text, flags=re.S)
          body = (
              match.group(1).strip()
              if match
              else f"Release {version} of patchmon.core."
          )

          notes_path.write_text(
              f"""## patchmon.core {version}

          {body}

          ### Migration from 1.0.0

          See [docs/migrating_to_2.0.md](https://github.com/{repo}/blob/v{version}/docs/migrating_to_2.0.md).
          This release does not provide FQCN redirects — update inventories to
          `plugin: patchmon.core.inventory`.

          ### Offline install

          Download `{tarball}` from the Assets below, then:

          ```bash
          ansible-galaxy collection install ./{tarball}
          ```

          ### Install from this release URL

          ```bash
          ansible-galaxy collection install \\
            https://github.com/{repo}/releases/download/v{version}/{tarball}
          ```
          """.replace(
                  "\n          ", "\n"
              ).lstrip(),
              encoding="utf-8",
          )
          PY
          echo "path=${NOTES_FILE}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: patchmon.core ${{ steps.meta.outputs.version }}
          body_path: ${{ steps.notes.outputs.path }}
          files: ${{ steps.meta.outputs.tarball }}
          fail_on_unmatched_files: true
          generate_release_notes: false
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
