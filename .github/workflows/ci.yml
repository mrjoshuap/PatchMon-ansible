---
# Pull-request and main-branch validation for patchmon.ansible
name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core>=2.15" "requests>=2.25.1" pytest ansible-lint

      - name: Run unit tests
        run: pytest -q

      - name: Install collection into path for lint
        run: |
          mkdir -p ~/.ansible/collections/ansible_collections/patchmon
          ln -sfn "$GITHUB_WORKSPACE" \
            ~/.ansible/collections/ansible_collections/patchmon/ansible

      - name: Lint example playbooks
        run: ansible-lint examples/playbooks
