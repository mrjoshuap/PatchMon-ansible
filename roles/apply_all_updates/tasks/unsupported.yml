# SPDX-License-Identifier: AGPL-3.0-or-later
- name: Fail on unsupported package manager
  ansible.builtin.fail:
    msg: >-
      Unsupported package manager {{ ansible_facts['pkg_mgr'] }} on
      {{ inventory_hostname }}
      ({{ ansible_facts['distribution'] | default('unknown') }}
      {{ ansible_facts['distribution_version'] | default('') }},
      os_family={{ ansible_facts['os_family'] | default('unknown') }}).
      patchmon.core.apply_all_updates stopped.

      Create a PatchMon feedback request: https://feedback.patchmon.net/

      Subject: Support {{ ansible_facts['pkg_mgr'] }} in patchmon.core package updates

      Description:
      {{ inventory_hostname }} reports pkg_mgr={{ ansible_facts['pkg_mgr'] }}
      ({{ ansible_facts['distribution'] | default('unknown') }}
      {{ ansible_facts['distribution_version'] | default('') }},
      os_family={{ ansible_facts['os_family'] | default('unknown') }}).
      patchmon.core.apply_all_updates and patchmon.core.apply_security_updates
      only upgrade apt, dnf, dnf5, and pacman. Please add this package manager
      to those roles.
