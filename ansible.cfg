# Local development: resolve the in-tree collection without a Galaxy install.
# After cloning, the release workflow / `ansible-galaxy collection install`
# still apply for non-dev use.
[defaults]
collections_path = ./.collections:~/.ansible/collections:/usr/share/ansible/collections
host_key_checking = false
interpreter_python = auto_silent
inventory = examples/patchmon_inventory_stats.yml

fact_caching_connection = .cache
fact_caching = jsonfile

[inventory]
enable_plugins = patchmon.core.inventory
