---
# SPDX-License-Identifier: AGPL-3.0-or-later
- name: Validate all-updates inputs
  ansible.builtin.include_tasks: validate.yml

- name: Record whether this host is eligible for all pending upgrades
  ansible.builtin.set_fact:
    apply_all_updates_eligible: "{{ 'patchmon_manual' not in group_names }}"

- name: Apply apt upgrades
  ansible.builtin.apt:
    update_cache: true
    upgrade: safe
    force_apt_get: true
  when:
    - apply_all_updates_eligible | bool
    - ansible_pkg_mgr == 'apt'

- name: Apply dnf upgrades  # noqa: package-latest
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: true
  when:
    - apply_all_updates_eligible | bool
    - ansible_pkg_mgr == 'dnf'

- name: Apply dnf5 upgrades  # noqa: package-latest
  ansible.builtin.dnf5:
    name: "*"
    state: latest
    update_cache: true
  when:
    - apply_all_updates_eligible | bool
    - ansible_pkg_mgr == 'dnf5'

- name: Fail on unsupported package manager
  ansible.builtin.fail:
    msg: >-
      Unsupported package manager {{ ansible_pkg_mgr }} on
      {{ inventory_hostname }}
      ({{ ansible_distribution | default('unknown') }}
      {{ ansible_distribution_version | default('') }},
      ansible_os_family={{ ansible_os_family | default('unknown') }}).
      patchmon.core.apply_all_updates stopped.

      Create a PatchMon feedback request: https://feedback.patchmon.net/

      Subject: Support {{ ansible_pkg_mgr }} in patchmon.core package updates

      Description:
      {{ inventory_hostname }} reports ansible_pkg_mgr={{ ansible_pkg_mgr }}
      ({{ ansible_distribution | default('unknown') }}
      {{ ansible_distribution_version | default('') }},
      ansible_os_family={{ ansible_os_family | default('unknown') }}).
      patchmon.core.apply_all_updates and patchmon.core.apply_security_updates
      only upgrade apt, dnf, and dnf5. Please add this package manager to those roles.
  when:
    - apply_all_updates_eligible | bool
    - ansible_pkg_mgr not in ['apt', 'dnf', 'dnf5']

- name: Report package state to PatchMon after upgrades
  ansible.builtin.include_role:
    name: patchmon.core.agent
  vars:
    agent_state: report
  when:
    - apply_all_updates_eligible | bool
    - ansible_pkg_mgr in ['apt', 'dnf', 'dnf5']
