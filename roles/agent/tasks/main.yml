---
# SPDX-License-Identifier: AGPL-3.0-or-later
- name: Validate agent role inputs
  ansible.builtin.include_tasks: validate.yml

- name: Preview PatchMon agent installation
  ansible.builtin.debug:
    msg: >-
      Check mode only: a normal run would download and execute the agent
      installer, then start and enable the agent service{{ ' and request a report' if agent_report | bool else '' }}.
      The installer and dependent service/report tasks are skipped.
      Installer changes cannot be predicted; installation success and API
      credentials have not been verified.
  when: agent_state == 'present' and ansible_check_mode

- name: Install PatchMon agent on Windows
  ansible.builtin.include_tasks: windows/install.yml
  when:
    - agent_state == 'present'
    - not ansible_check_mode
    - ansible_facts['os_family'] | default('') == 'Windows'

- name: Install PatchMon agent via enrollment script
  ansible.builtin.include_tasks: install.yml
  when:
    - agent_state == 'present'
    - not ansible_check_mode
    - ansible_facts['os_family'] | default('') != 'Windows'

- name: Fail before managing the FreeBSD agent service
  ansible.builtin.fail:
    msg: >-
      {{ inventory_hostname }} is FreeBSD. The enrollment script can install
      the agent. patchmon.core.agent stopped before managing the service.

      Create a PatchMon feedback request: https://feedback.patchmon.net/

      Subject: Manage the FreeBSD rc.d agent service in patchmon.core.agent

      Description:
      The PatchMon enrollment script can install the FreeBSD agent on
      {{ inventory_hostname }}. patchmon.core.agent then starts a service
      named patchmon-agent. FreeBSD registers
      /usr/local/etc/rc.d/patchmon_agent. Please manage that rc.d service,
      and keep the Linux systemd unit for other hosts.
  when:
    - ansible_facts['os_family'] is defined
    - ansible_facts['os_family'] == 'FreeBSD'
    - agent_state in ['present', 'started', 'stopped']

- name: Manage PatchMon agent service
  ansible.builtin.include_tasks:
    file: "{{ 'windows/service.yml' if ansible_facts['os_family'] | default('') == 'Windows' else 'service.yml' }}"
  when:
    - agent_state in ['present', 'started', 'stopped']
    - not (agent_state == 'present' and ansible_check_mode)

- name: Report from PatchMon agent
  ansible.builtin.include_tasks:
    file: "{{ 'windows/report.yml' if ansible_facts['os_family'] | default('') == 'Windows' else 'report.yml' }}"
  when:
    - agent_state == 'report' or (agent_state == 'present' and agent_report | bool)
    - not (agent_state == 'present' and ansible_check_mode)

- name: Preview PatchMon agent removal on Windows
  ansible.builtin.debug:
    msg: >-
      Check mode only: a normal run would download and execute the Windows
      agent removal script with -RemoveAll -Force, then remove the staged script.
      Download, staging, execution, and script cleanup are skipped.
      Removal script changes cannot be predicted; removal success and server
      connectivity have not been verified. The PatchMon host record is retained.
  when:
    - agent_state == 'absent'
    - ansible_check_mode
    - ansible_facts['os_family'] | default('') == 'Windows'

- name: Remove PatchMon agent on Windows
  ansible.builtin.include_tasks: windows/absent.yml
  when:
    - agent_state == 'absent'
    - not ansible_check_mode
    - ansible_facts['os_family'] | default('') == 'Windows'

- name: Remove PatchMon agent
  ansible.builtin.include_tasks: absent.yml
  when:
    - agent_state == 'absent'
    - ansible_facts['os_family'] | default('') != 'Windows'
